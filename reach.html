<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D-TECH Outreach Hub | 1-Click WhatsApp Dispatcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-surface: #131B2E;
            --bg-card: #1E293B;
            --border: #334155;
            --border-highlight: #3B82F6;
            --primary: #2563EB;
            --primary-light: #3B82F6;
            --whatsapp: #25D366;
            --whatsapp-dark: #128C7E;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --success: #10B981;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 5rem;
            line-height: 1.5;
        }

        /* Header Bar */
        .top-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.85rem 1rem;
        }

        .top-header-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .brand-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 1.05rem;
        }

        .brand-pill {
            background: rgba(37, 99, 235, 0.2);
            color: #60A5FA;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            text-transform: uppercase;
        }

        .header-links {
            display: flex;
            gap: 0.75rem;
        }

        .header-link-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.35rem 0.65rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .header-link-btn:hover {
            color: white;
            border-color: #64748B;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.25rem 1rem;
        }

        /* Hero / Instructions */
        .hub-title-box {
            text-align: center;
            margin-bottom: 1.25rem;
        }

        .hub-title-box h1 {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 0.35rem;
            background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hub-title-box p {
            color: var(--text-muted);
            font-size: 0.88rem;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Main Switcher Tabs */
        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            background: var(--bg-surface);
            padding: 0.5rem;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            margin-bottom: 1.25rem;
        }

        .tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            gap: 0.2rem;
        }

        .tab-btn span.tab-count {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .tab-btn.active span.tab-count {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        /* Tracker Card */
        .tracker-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 1.25rem;
        }

        .tracker-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
            font-size: 0.88rem;
        }

        .tracker-stats {
            font-weight: 700;
            color: white;
        }

        .tracker-stats span {
            color: var(--success);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10B981, #059669);
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        /* Search & Filter Bar */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .search-input-wrap {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            color: white;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary-light);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .filter-pills {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 0.2rem;
            -webkit-overflow-scrolling: touch;
        }

        .filter-pill {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .filter-pill.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary-light);
            color: #93C5FD;
        }

        /* Lead List */
        .leads-grid {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .lead-card {
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.15rem;
            transition: all 0.2s ease;
            position: relative;
        }

        .lead-card.contacted {
            border-color: rgba(16, 185, 129, 0.4);
            background: linear-gradient(180deg, rgba(16, 185, 129, 0.04) 0%, #131B2E 100%);
        }

        .lead-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .lead-name {
            font-size: 1.05rem;
            font-weight: 800;
            color: white;
            line-height: 1.3;
        }

        .lead-badge-contacted {
            display: none;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.15);
            color: #34D399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        .lead-card.contacted .lead-badge-contacted {
            display: inline-flex;
        }

        .lead-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .meta-tag {
            font-size: 0.74rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .meta-tag.category {
            background: rgba(59, 130, 246, 0.12);
            color: #93C5FD;
            border-color: rgba(59, 130, 246, 0.2);
        }

        .lead-info-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin-bottom: 0.95rem;
        }

        .lead-info-item {
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .lead-info-item strong {
            color: #E2E8F0;
        }

        /* Action Buttons */
        .lead-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.5rem;
        }

        .btn-wa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            background: #25D366;
            color: #042F1A;
            font-weight: 800;
            font-size: 0.92rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
            text-align: center;
        }

        .btn-wa:hover, .btn-wa:active {
            background: #1EBE5D;
            transform: translateY(-1px);
        }

        .lead-card.contacted .btn-wa {
            background: #128C7E;
            color: white;
            box-shadow: none;
        }

        .btn-icon-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0 0.85rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-icon-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1E293B;
            color: white;
            border: 1px solid var(--primary-light);
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .empty-state span {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 480px) {
            .hub-title-box h1 { font-size: 1.3rem; }
            .tab-btn { font-size: 0.88rem; padding: 0.75rem 0.25rem; }
            .lead-name { font-size: 0.98rem; }
            .btn-wa { font-size: 0.88rem; padding: 0.7rem 0.75rem; }
        }
    </style>
</head>

    <!-- Header Bar -->
    <header class="top-header">
        <div class="top-header-inner">
            <a href="index.html" class="brand-link">
                <span>DTECH</span>
                <span class="brand-pill">Outreach Hub</span>
            </a>
            <div class="header-links">
                <a href="npo.html" class="header-link-btn">NPO Page</a>
                <a href="quote.html" class="header-link-btn">Quote Page</a>
            </div>
        </div>
    </header>

    <div class="container">

        <!-- Title -->
        <div class="hub-title-box">
            <h1>1-Click WhatsApp Outreach Hub</h1>
            <p>Tap any lead to launch WhatsApp with the personalized D-TECH offer pre-filled. Progress is saved automatically on your device.</p>
        </div>

        <!-- Tab Switcher (NPO vs Business) -->
        <div class="tab-switcher">
            <button class="tab-btn active" id="tabNpoBtn" onclick="switchTab('npo')">
                <span>🏛️ NPO Outreach</span>
                <span class="tab-count" id="npoCountBadge">121</span>
            </button>
            <button class="tab-btn" id="tabBizBtn" onclick="switchTab('biz')">
                <span>🏢 Local Business</span>
                <span class="tab-count" id="bizCountBadge">137</span>
            </button>
        </div>

        <!-- Tracker / Progress Bar -->
        <div class="tracker-card">
            <div class="tracker-header">
                <div class="tracker-stats">
                    <span id="trackerContactedCount">0</span> of <span id="trackerTotalCount">0</span> Contacted
                    (<span id="trackerPercent">0%</span>)
                </div>
                <button onclick="resetCurrentProgress()" style="background: none; border: none; color: #64748B; font-size: 0.76rem; cursor: pointer; text-decoration: underline;">
                    Reset Progress
                </button>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <!-- Search & Filter Controls -->
        <div class="controls-row">
            <div class="search-input-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name, trade, or city..." oninput="handleSearch()">
            </div>
            <div class="filter-pills">
                <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">All Leads</button>
                <button class="filter-pill" data-filter="wa" onclick="setFilter('wa')">📱 WhatsApp Only</button>
                <button class="filter-pill" data-filter="pending" onclick="setFilter('pending')">⏳ Not Contacted</button>
                <button class="filter-pill" data-filter="contacted" onclick="setFilter('contacted')">✓ Contacted</button>
            </div>
        </div>

        <!-- Leads List -->
        <div class="leads-grid" id="leadsContainer">
            <!-- Rendered dynamically -->
        </div>

    </div>

        let currentTab = 'npo';

        // LocalStorage keys for contacted state
        const STORAGE_KEY_NPO = 'dtech_contacted_npos';
        const STORAGE_KEY_BIZ = 'dtech_contacted_biz';

        function getContactedSet(tab) {
            const key = tab === 'npo' ? STORAGE_KEY_NPO : STORAGE_KEY_BIZ;
            try {
                const raw = localStorage.getItem(key);
                return raw ? new Set(JSON.parse(raw)) : new Set();
            } catch(e) {
                return new Set();
            }
        }

        function saveContactedSet(tab, setObj) {
            const key = tab === 'npo' ? STORAGE_KEY_NPO : STORAGE_KEY_BIZ;
            localStorage.setItem(key, JSON.stringify(Array.from(setObj)));
        }

        function markAsContacted(leadId) {
            const setObj = getContactedSet(currentTab);
            setObj.add(leadId);
            saveContactedSet(currentTab, setObj);
            render();
            showToast('Progress saved! Marked as Contacted ✓');
        }

        function toggleContacted(leadId) {
            const setObj = getContactedSet(currentTab);
            if (setObj.has(leadId)) {
                setObj.delete(leadId);
            } else {
                setObj.add(leadId);
            }
            saveContactedSet(currentTab, setObj);
            render();
        }

        function resetCurrentProgress() {
            if (confirm(`Reset all contacted progress for ${currentTab === 'npo' ? 'NPO' : 'Business'} leads?`)) {
                saveContactedSet(currentTab, new Set());
                render();
            }
        }

        function copyLeadMessage(msg) {
            navigator.clipboard.writeText(msg).then(() => {
                showToast('📋 Outreach message copied to clipboard!');
            }).catch(() => {
                showToast('Failed to copy');
            });
        }

        function showToast(text) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tabNpoBtn').classList.toggle('active', tab === 'npo');
            document.getElementById('tabBizBtn').classList.toggle('active', tab === 'biz');
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            currentFilter = 'all';
            document.querySelectorAll('.filter-pill').forEach(p => {
                p.classList.toggle('active', p.getAttribute('data-filter') === 'all');
            });
            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-pill').forEach(p => {
                p.classList.toggle('active', p.getAttribute('data-filter') === filter);
            });
            render();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.trim().toLowerCase();
            render();
        }

        function render() {
            const rawList = currentTab === 'npo' ? NPO_LEADS : BIZ_LEADS;
            const contactedSet = getContactedSet(currentTab);

            // Filter
            const filtered = rawList.filter(l => {
                // Search filter
                if (searchQuery) {
                    const matchName = (l.name || '').toLowerCase().includes(searchQuery);
                    const matchCat = (l.category || '').toLowerCase().includes(searchQuery);
                    const matchLoc = (l.location || '').toLowerCase().includes(searchQuery);
                    const matchPhone = (l.phone || '').includes(searchQuery);
                    if (!matchName && !matchCat && !matchLoc && !matchPhone) return false;
                }

                // Status filter
                const isContacted = contactedSet.has(l.id);
                if (currentFilter === 'wa' && !l.is_whatsapp) return false;
                if (currentFilter === 'pending' && isContacted) return false;
                if (currentFilter === 'contacted' && !isContacted) return false;

                return true;
            });

            // Update Stats
            const totalInList = rawList.length;
            const totalContacted = contactedSet.size;
            const pct = totalInList > 0 ? Math.round((totalContacted / totalInList) * 100) : 0;

            document.getElementById('trackerContactedCount').textContent = totalContacted;
            document.getElementById('trackerTotalCount').textContent = totalInList;
            document.getElementById('trackerPercent').textContent = pct + '%';
            document.getElementById('progressBarFill').style.width = pct + '%';

            // Badges
            document.getElementById('npoCountBadge').textContent = NPO_LEADS.length;
            document.getElementById('bizCountBadge').textContent = BIZ_LEADS.length;

            // Render cards
            const container = document.getElementById('leadsContainer');
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span>🔍</span>
                        <h3>No leads match your search or filter</h3>
                        <p style="font-size: 0.85rem; margin-top: 0.25rem;">Try clearing your search query or switching filters.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((l, index) => {
                const isContacted = contactedSet.has(l.id);
                const hasWa = l.is_whatsapp && l.wa_url;
                const contactPersonHtml = l.contact_person ? `<div class="lead-info-item">👤 <strong>Contact:</strong> ${escapeHtml(l.contact_person)}</div>` : '';
                const emailHtml = l.email ? `<div class="lead-info-item">✉️ <strong>Email:</strong> ${escapeHtml(l.email)}</div>` : '';
                const locationHtml = l.location ? `<div class="lead-info-item">📍 <strong>Location:</strong> ${escapeHtml(l.location)}</div>` : '';

                const actionBtnHtml = hasWa
                    ? `<a href="${l.wa_url}" target="_blank" onclick="markAsContacted('${l.id}')" class="btn-wa">
                           <span>💬</span>
                           <span>${isContacted ? 'Message Sent (Send Again)' : 'Open in WhatsApp & Send'}</span>
                       </a>`
                    : `<a href="tel:${l.phone}" class="btn-wa" style="background: #3B82F6; color: white;">
                           <span>📞</span>
                           <span>Call Direct: ${escapeHtml(l.phone)}</span>
                       </a>`;

                html += `
                    <div class="lead-card ${isContacted ? 'contacted' : ''}" id="card_${l.id}">
                        <div class="lead-card-top">
                            <div class="lead-name">
                                ${escapeHtml(l.name)}
                            </div>
                            <span class="lead-badge-contacted">✓ Contacted</span>
                        </div>

                        <div class="lead-meta">
                            <span class="meta-tag category">${escapeHtml(l.category)}</span>
                            <span class="meta-tag">${l.is_whatsapp ? '📱 WhatsApp Ready' : '📞 Landline'}</span>
                        </div>

                        <div class="lead-info-list">
                            ${contactPersonHtml}
                            <div class="lead-info-item">📞 <strong>Phone:</strong> ${escapeHtml(l.phone)}</div>
                            ${emailHtml}
                            ${locationHtml}
                        </div>

                        <div class="lead-actions">
                            ${actionBtnHtml}
                            <button class="btn-icon-secondary" onclick="toggleContacted('${l.id}')" title="Toggle Contacted status">
                                ${isContacted ? 'Undo' : '✓ Done'}
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initial Render
        render();
    </script>
</body>
</html>
